<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nimbus — Weather Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  /* ─── CSS Variables & Reset ─── */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg-from: #0d1b3e;
    --bg-mid:  #1a2d5a;
    --bg-to:   #0f2040;
    --glass-bg: rgba(255,255,255,0.07);
    --glass-border: rgba(255,255,255,0.13);
    --glass-hover: rgba(255,255,255,0.11);
    --text-primary: #f0f4ff;
    --text-secondary: rgba(200,215,255,0.7);
    --text-muted: rgba(180,200,255,0.45);
    --accent: #5eb8ff;
    --accent-dim: rgba(94,184,255,0.18);
    --shadow: 0 8px 32px rgba(0,0,20,0.45);
    --radius-sm: 12px;
    --radius-md: 18px;
    --radius-lg: 26px;
    --transition: 0.35s cubic-bezier(.4,0,.2,1);
  }

  /* ─── Theme palettes ─── */
  body.theme-sunny    { --bg-from:#1a3a0d; --bg-mid:#2d5a1a; --bg-to:#0f2a08; --accent:#ffe066; --accent-dim:rgba(255,224,102,0.16); }
  body.theme-cloudy   { --bg-from:#1e2230; --bg-mid:#2a3050; --bg-to:#15182a; --accent:#a0b4e0; --accent-dim:rgba(160,180,224,0.15); }
  body.theme-rainy    { --bg-from:#0d1e30; --bg-mid:#112840; --bg-to:#09131e; --accent:#56c8e8; --accent-dim:rgba(86,200,232,0.15); }
  body.theme-snowy    { --bg-from:#1a2030; --bg-mid:#2a3555; --bg-to:#12192a; --accent:#d0e8ff; --accent-dim:rgba(208,232,255,0.18); }
  body.theme-stormy   { --bg-from:#110d20; --bg-mid:#1c1535; --bg-to:#0b0915; --accent:#b080ff; --accent-dim:rgba(176,128,255,0.18); }
  body.theme-foggy    { --bg-from:#1a1f25; --bg-mid:#252d38; --bg-to:#12161c; --accent:#90a8c0; --accent-dim:rgba(144,168,192,0.15); }
  body.theme-night    { --bg-from:#05091a; --bg-mid:#0d1530; --bg-to:#030612; --accent:#7eb0ff; --accent-dim:rgba(126,176,255,0.16); }

  body {
    font-family: 'Outfit', sans-serif;
    min-height: 100vh;
    background: radial-gradient(ellipse at 30% 20%, var(--bg-from) 0%, var(--bg-mid) 50%, var(--bg-to) 100%);
    color: var(--text-primary);
    transition: background var(--transition), color var(--transition);
    overflow-x: hidden;
    position: relative;
  }

  /* ─── Animated bg particles ─── */
  .bg-particles {
    position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden;
  }
  .particle {
    position: absolute;
    border-radius: 50%;
    background: var(--accent);
    opacity: 0;
    animation: float linear infinite;
  }
  @keyframes float {
    0%   { transform: translateY(110vh) scale(0); opacity: 0; }
    10%  { opacity: 0.12; }
    90%  { opacity: 0.06; }
    100% { transform: translateY(-10vh) scale(1); opacity: 0; }
  }

  /* ─── App wrapper ─── */
  .app {
    position: relative; z-index: 1;
    max-width: 900px;
    margin: 0 auto;
    padding: 2rem 1.25rem 3rem;
  }

  /* ─── Header ─── */
  .header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 2rem;
  }
  .logo {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 2rem;
    letter-spacing: 3px;
    color: var(--accent);
    text-shadow: 0 0 30px var(--accent-dim);
  }
  .logo span { color: var(--text-primary); }

  .unit-toggle {
    display: flex; align-items: center; gap: 0;
    background: var(--glass-bg);
    border: 1px solid var(--glass-border);
    border-radius: 50px;
    overflow: hidden;
  }
  .unit-btn {
    padding: 0.45rem 1.1rem;
    font-size: 0.85rem;
    font-weight: 500;
    font-family: 'Outfit', sans-serif;
    background: transparent;
    border: none;
    color: var(--text-secondary);
    cursor: pointer;
    transition: all 0.2s;
  }
  .unit-btn.active {
    background: var(--accent-dim);
    color: var(--accent);
  }
  .unit-btn:hover:not(.active) { background: var(--glass-hover); color: var(--text-primary); }

  /* ─── Search ─── */
  .search-wrap {
    position: relative;
    margin-bottom: 2rem;
  }
  .search-row {
    display: flex; gap: 0.6rem;
  }
  .search-input {
    flex: 1;
    background: var(--glass-bg);
    border: 1px solid var(--glass-border);
    border-radius: var(--radius-sm);
    padding: 0.85rem 1.25rem 0.85rem 3rem;
    font-size: 1rem;
    font-family: 'Outfit', sans-serif;
    color: var(--text-primary);
    outline: none;
    backdrop-filter: blur(12px);
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .search-input::placeholder { color: var(--text-muted); }
  .search-input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-dim);
  }
  .search-icon {
    position: absolute;
    left: 1rem; top: 50%; transform: translateY(-50%);
    color: var(--text-muted);
    pointer-events: none;
    font-size: 1.1rem;
  }
  .search-btn {
    padding: 0.85rem 1.5rem;
    background: var(--accent-dim);
    border: 1px solid var(--accent);
    border-radius: var(--radius-sm);
    color: var(--accent);
    font-size: 0.95rem;
    font-family: 'Outfit', sans-serif;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s;
    white-space: nowrap;
  }
  .search-btn:hover { background: var(--accent); color: #05091a; }
  .search-btn:active { transform: scale(0.97); }

  /* Recent searches */
  .recent-searches {
    display: flex; flex-wrap: wrap; gap: 0.5rem;
    margin-top: 0.75rem;
  }
  .recent-tag {
    background: var(--glass-bg);
    border: 1px solid var(--glass-border);
    border-radius: 50px;
    padding: 0.3rem 0.9rem;
    font-size: 0.8rem;
    color: var(--text-secondary);
    cursor: pointer;
    transition: all 0.2s;
    display: flex; align-items: center; gap: 0.35rem;
  }
  .recent-tag:hover { border-color: var(--accent); color: var(--accent); }
  .recent-tag .remove-tag {
    opacity: 0.5; font-size: 0.75rem; margin-left: 2px;
    transition: opacity 0.2s;
  }
  .recent-tag:hover .remove-tag { opacity: 1; }

  /* ─── Glass card base ─── */
  .glass-card {
    background: var(--glass-bg);
    border: 1px solid var(--glass-border);
    border-radius: var(--radius-md);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
  }

  /* ─── Current weather ─── */
  .current-weather {
    padding: 2rem 2rem 1.75rem;
    margin-bottom: 1.25rem;
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 1rem;
    align-items: start;
  }
  .location-name {
    font-size: 1.05rem;
    font-weight: 500;
    color: var(--accent);
    letter-spacing: 0.04em;
    margin-bottom: 0.2rem;
    display: flex; align-items: center; gap: 0.4rem;
  }
  .location-date {
    font-size: 0.82rem;
    color: var(--text-muted);
    margin-bottom: 1.25rem;
  }
  .temp-display {
    display: flex; align-items: flex-start; gap: 0.5rem;
  }
  .temp-value {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(5rem, 14vw, 8.5rem);
    line-height: 1;
    color: var(--text-primary);
    transition: color 0.3s;
  }
  .temp-unit-display {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(2rem, 5vw, 3.5rem);
    color: var(--text-muted);
    margin-top: 0.5rem;
  }
  .weather-desc {
    font-size: 1.1rem;
    font-weight: 400;
    color: var(--text-secondary);
    margin-top: 0.4rem;
    text-transform: capitalize;
  }
  .feels-like {
    font-size: 0.85rem;
    color: var(--text-muted);
    margin-top: 0.2rem;
  }

  /* Weather icon big */
  .weather-icon-big {
    font-size: clamp(4rem, 10vw, 6rem);
    text-align: center;
    filter: drop-shadow(0 4px 16px var(--accent-dim));
    animation: icon-bob 3s ease-in-out infinite;
    line-height: 1;
  }
  @keyframes icon-bob {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-8px); }
  }

  /* Stats row */
  .stats-row {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 0.75rem;
    margin-top: 1.5rem;
    padding-top: 1.5rem;
    border-top: 1px solid var(--glass-border);
  }
  .stat-item {
    display: flex; flex-direction: column; align-items: center; gap: 0.3rem;
    padding: 0.6rem;
    border-radius: var(--radius-sm);
    transition: background 0.2s;
  }
  .stat-item:hover { background: var(--glass-hover); }
  .stat-icon { font-size: 1.3rem; }
  .stat-label {
    font-size: 0.72rem;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }
  .stat-value {
    font-size: 1.05rem;
    font-weight: 500;
    color: var(--text-primary);
  }

  /* ─── Forecast ─── */
  .forecast-header {
    font-size: 0.78rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--text-muted);
    margin-bottom: 0.9rem;
    padding: 0 0.25rem;
  }
  .forecast-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
    gap: 0.75rem;
    margin-bottom: 1.25rem;
  }
  .forecast-card {
    padding: 1.1rem 0.75rem;
    text-align: center;
    border-radius: var(--radius-sm);
    cursor: default;
    transition: all 0.2s;
  }
  .forecast-card:hover { background: var(--glass-hover); transform: translateY(-3px); }
  .forecast-day {
    font-size: 0.78rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-muted);
    margin-bottom: 0.6rem;
  }
  .forecast-icon { font-size: 2rem; margin-bottom: 0.6rem; }
  .forecast-temps {
    display: flex; justify-content: center; align-items: baseline; gap: 0.4rem;
  }
  .forecast-high {
    font-size: 1.05rem;
    font-weight: 500;
    color: var(--text-primary);
  }
  .forecast-low {
    font-size: 0.85rem;
    color: var(--text-muted);
  }
  .forecast-desc {
    font-size: 0.72rem;
    color: var(--text-secondary);
    margin-top: 0.35rem;
    line-height: 1.3;
  }

  /* ─── Hourly forecast ─── */
  .hourly-scroll {
    display: flex;
    gap: 0.6rem;
    overflow-x: auto;
    padding-bottom: 0.5rem;
    scrollbar-width: thin;
    scrollbar-color: var(--glass-border) transparent;
  }
  .hourly-scroll::-webkit-scrollbar { height: 4px; }
  .hourly-scroll::-webkit-scrollbar-track { background: transparent; }
  .hourly-scroll::-webkit-scrollbar-thumb { background: var(--glass-border); border-radius: 2px; }
  .hourly-item {
    flex-shrink: 0;
    display: flex; flex-direction: column; align-items: center; gap: 0.35rem;
    padding: 0.75rem 0.9rem;
    border-radius: var(--radius-sm);
    min-width: 72px;
    transition: background 0.2s;
    cursor: default;
  }
  .hourly-item:hover { background: var(--glass-hover); }
  .hourly-time {
    font-size: 0.72rem;
    color: var(--text-muted);
    font-weight: 500;
  }
  .hourly-icon { font-size: 1.35rem; }
  .hourly-temp {
    font-size: 0.92rem;
    font-weight: 500;
    color: var(--text-primary);
  }

  /* ─── Loading spinner ─── */
  .loading-overlay {
    display: none;
    position: fixed; inset: 0; z-index: 100;
    background: rgba(5,9,26,0.7);
    backdrop-filter: blur(8px);
    align-items: center; justify-content: center;
    flex-direction: column; gap: 1.2rem;
  }
  .loading-overlay.active { display: flex; }
  .spinner {
    width: 54px; height: 54px;
    border-radius: 50%;
    border: 3px solid var(--glass-border);
    border-top-color: var(--accent);
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading-text {
    font-size: 0.9rem;
    color: var(--text-secondary);
    letter-spacing: 0.04em;
  }

  /* ─── Error / Empty states ─── */
  .state-msg {
    text-align: center;
    padding: 3rem 1rem;
    color: var(--text-secondary);
  }
  .state-msg .state-icon { font-size: 3.5rem; margin-bottom: 1rem; }
  .state-msg h3 { font-size: 1.2rem; font-weight: 500; color: var(--text-primary); margin-bottom: 0.4rem; }
  .state-msg p  { font-size: 0.9rem; color: var(--text-muted); }

  .error-toast {
    position: fixed;
    bottom: 1.5rem; left: 50%; transform: translateX(-50%) translateY(100px);
    background: rgba(180,40,40,0.85);
    border: 1px solid rgba(220,80,80,0.5);
    backdrop-filter: blur(12px);
    color: #ffd5d5;
    padding: 0.75rem 1.5rem;
    border-radius: 50px;
    font-size: 0.9rem;
    z-index: 200;
    transition: transform 0.35s cubic-bezier(.4,0,.2,1);
    white-space: nowrap;
  }
  .error-toast.show { transform: translateX(-50%) translateY(0); }

  /* ─── UV / Air quality bar ─── */
  .uv-bar-wrap {
    margin-top: 1rem;
  }
  .uv-bar-label {
    display: flex; justify-content: space-between;
    font-size: 0.78rem; color: var(--text-muted);
    margin-bottom: 0.35rem;
  }
  .uv-bar {
    height: 6px;
    border-radius: 3px;
    background: linear-gradient(to right, #4ade80, #facc15, #f97316, #ef4444, #9f1239);
    position: relative;
    overflow: visible;
  }
  .uv-indicator {
    position: absolute;
    top: -4px;
    width: 14px; height: 14px;
    border-radius: 50%;
    background: white;
    border: 2px solid var(--accent);
    transition: left 0.5s;
    box-shadow: 0 0 8px var(--accent-dim);
    transform: translateX(-50%);
  }

  /* ─── Section card padding ─── */
  .section-card { padding: 1.5rem; margin-bottom: 1.25rem; }

  /* ─── Sunrise/Sunset ─── */
  .sun-row {
    display: grid; grid-template-columns: 1fr 1fr;
    gap: 1rem;
    margin-top: 1rem;
  }
  .sun-item {
    display: flex; align-items: center; gap: 0.8rem;
    padding: 0.85rem 1rem;
    border-radius: var(--radius-sm);
    background: var(--glass-bg);
    border: 1px solid var(--glass-border);
  }
  .sun-item-icon { font-size: 1.6rem; }
  .sun-item-label { font-size: 0.75rem; color: var(--text-muted); }
  .sun-item-time  { font-size: 1.05rem; font-weight: 500; color: var(--text-primary); margin-top: 0.1rem; }

  /* ─── Responsive ─── */
  @media (max-width: 620px) {
    .current-weather { grid-template-columns: 1fr; }
    .weather-icon-big { text-align: left; font-size: 4rem; }
    .stats-row { grid-template-columns: repeat(2, 1fr); }
    .sun-row { grid-template-columns: 1fr; }
    .header { flex-wrap: wrap; gap: 0.75rem; }
    .app { padding: 1.25rem 1rem 2.5rem; }
    .section-card { padding: 1.1rem 1rem; }
    .current-weather { padding: 1.25rem 1rem 1rem; }
  }
  @media (max-width: 380px) {
    .stats-row { grid-template-columns: repeat(2,1fr); }
    .forecast-grid { grid-template-columns: repeat(3,1fr); }
  }

  /* ─── Animations ─── */
  .fade-in {
    animation: fadeIn 0.5s ease both;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .fade-in:nth-child(2) { animation-delay: 0.07s; }
  .fade-in:nth-child(3) { animation-delay: 0.14s; }
  .fade-in:nth-child(4) { animation-delay: 0.21s; }
  .fade-in:nth-child(5) { animation-delay: 0.28s; }

  /* ─── Welcome empty state ─── */
  #welcome-state { animation: fadeIn 0.6s ease both; }
</style>
</head>
<body>

<!-- ─── Background particles ─── -->
<div class="bg-particles" id="particles"></div>

<!-- ─── Loading overlay ─── -->
<div class="loading-overlay" id="loading">
  <div class="spinner"></div>
  <p class="loading-text">Fetching weather data…</p>
</div>

<!-- ─── Error toast ─── -->
<div class="error-toast" id="error-toast">City not found. Please try again.</div>

<!-- ─── Main app ─── -->
<div class="app">

  <!-- Header -->
  <header class="header">
    <div class="logo">NIMBUS<span>.</span></div>
    <div class="unit-toggle">
      <button class="unit-btn active" id="btn-c" onclick="setUnit('C')">°C</button>
      <button class="unit-btn"        id="btn-f" onclick="setUnit('F')">°F</button>
    </div>
  </header>

  <!-- Search -->
  <div class="search-wrap">
    <div class="search-row">
      <div style="position:relative;flex:1;">
        <span class="search-icon">🔍</span>
        <input
          class="search-input"
          id="search-input"
          type="text"
          placeholder="Search city… e.g. London, Tokyo, New York"
          autocomplete="off"
          onkeydown="if(event.key==='Enter') doSearch()"
        >
      </div>
      <button class="search-btn" onclick="doSearch()">Search</button>
    </div>
    <div class="recent-searches" id="recent-searches"></div>
  </div>

  <!-- Weather content -->
  <div id="weather-content">
    <!-- Welcome state -->
    <div id="welcome-state" class="glass-card section-card" style="text-align:center;padding:3.5rem 1rem;">
      <div style="font-size:4rem;margin-bottom:1rem;">🌤️</div>
      <h2 style="font-family:'Bebas Neue',sans-serif;font-size:2rem;letter-spacing:2px;color:var(--text-primary);margin-bottom:0.5rem;">Welcome to Nimbus</h2>
      <p style="color:var(--text-secondary);font-size:0.95rem;max-width:360px;margin:0 auto;">
        Search for any city to get live weather conditions, forecasts, and more.
      </p>
    </div>
  </div>

</div>

<script>
/* ──────────────────────────────────────────────
   NIMBUS WEATHER DASHBOARD — v1.0
   Data source: wttr.in (free, no key required)
   ────────────────────────────────────────────── */

let currentUnit = 'C';
let rawData     = null;
let recentCities = JSON.parse(localStorage.getItem('nimbus_recent') || '[]');

/* ─── Particle system ─── */
(function initParticles() {
  const container = document.getElementById('particles');
  for (let i = 0; i < 18; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    const sz = Math.random() * 3 + 1;
    p.style.cssText = `
      width:${sz}px; height:${sz}px;
      left:${Math.random()*100}%;
      animation-duration:${8+Math.random()*14}s;
      animation-delay:${Math.random()*12}s;
    `;
    container.appendChild(p);
  }
})();

/* ─── Unit toggle ─── */
function setUnit(u) {
  currentUnit = u;
  document.getElementById('btn-c').classList.toggle('active', u === 'C');
  document.getElementById('btn-f').classList.toggle('active', u === 'F');
  if (rawData) renderWeather(rawData); // re-render with new unit
}

/* ─── Convert temp ─── */
function toDisplayTemp(c) {
  if (currentUnit === 'F') return Math.round(c * 9/5 + 32);
  return Math.round(Number(c));
}

/* ─── Weather icon mapper ─── */
function getWeatherEmoji(code, isDay = true) {
  // wttr.in weather codes
  const map = {
    113: isDay ? '☀️' : '🌙',
    116: isDay ? '⛅' : '🌥️',
    119: '☁️',
    122: '🌫️',
    143: '🌫️',
    176: '🌦️',
    179: '🌨️',
    182: '🌧️',
    185: '🌧️',
    200: '⛈️',
    227: '❄️',
    230: '🌨️',
    248: '🌫️',
    260: '🌫️',
    263: '🌦️',
    266: '🌧️',
    281: '🌧️',
    284: '🌧️',
    293: '🌦️',
    296: '🌧️',
    299: '🌧️',
    302: '🌧️',
    305: '🌧️',
    308: '🌧️',
    311: '🌧️',
    314: '🌧️',
    317: '🌨️',
    320: '🌨️',
    323: '❄️',
    326: '❄️',
    329: '❄️',
    332: '❄️',
    335: '❄️',
    338: '❄️',
    350: '🌨️',
    353: '🌦️',
    356: '🌧️',
    359: '🌧️',
    362: '🌨️',
    365: '🌨️',
    368: '❄️',
    371: '❄️',
    374: '🌨️',
    377: '🌨️',
    386: '⛈️',
    389: '⛈️',
    392: '⛈️',
    395: '⛈️',
  };
  return map[Number(code)] || '🌡️';
}

/* ─── Theme based on condition code ─── */
function getTheme(code, isDay) {
  if (!isDay) return 'night';
  const n = Number(code);
  if (n === 113) return 'sunny';
  if ([116,119,122,143,248,260].includes(n)) return 'cloudy';
  if ([200,386,389,392,395].includes(n)) return 'stormy';
  if ([227,230,323,326,329,332,335,338,368,371].includes(n)) return 'snowy';
  if (n >= 176) return 'rainy';
  return 'cloudy';
}

/* ─── UV index label ─── */
function uvLabel(v) {
  const n = Number(v);
  if (n <= 2)  return 'Low';
  if (n <= 5)  return 'Moderate';
  if (n <= 7)  return 'High';
  if (n <= 10) return 'Very High';
  return 'Extreme';
}

/* ─── Day name from date string ─── */
function dayName(dateStr) {
  const d = new Date(dateStr + 'T12:00:00');
  const days = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  return days[d.getDay()];
}

/* ─── Show/hide loading ─── */
function setLoading(on) {
  document.getElementById('loading').classList.toggle('active', on);
}

/* ─── Show error toast ─── */
function showError(msg) {
  const t = document.getElementById('error-toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3500);
}

/* ─── Recent searches ─── */
function addRecent(city) {
  recentCities = [city, ...recentCities.filter(c => c.toLowerCase() !== city.toLowerCase())].slice(0, 6);
  localStorage.setItem('nimbus_recent', JSON.stringify(recentCities));
  renderRecent();
}
function removeRecent(city, e) {
  e.stopPropagation();
  recentCities = recentCities.filter(c => c !== city);
  localStorage.setItem('nimbus_recent', JSON.stringify(recentCities));
  renderRecent();
}
function renderRecent() {
  const wrap = document.getElementById('recent-searches');
  if (!recentCities.length) { wrap.innerHTML = ''; return; }
  wrap.innerHTML = recentCities.map(c => `
    <span class="recent-tag" onclick="searchCity('${c.replace(/'/g,"\\'")}')">
      🕐 ${c}
      <span class="remove-tag" onclick="removeRecent('${c.replace(/'/g,"\\'")}', event)">✕</span>
    </span>
  `).join('');
}
renderRecent();

/* ─── Main search ─── */
function doSearch() {
  const val = document.getElementById('search-input').value.trim();
  if (!val) return;
  searchCity(val);
}
function searchCity(city) {
  document.getElementById('search-input').value = city;
  fetchWeather(city);
}

/* ─── Fetch from wttr.in ─── */
async function fetchWeather(city) {
  setLoading(true);
  try {
    const url = `https://wttr.in/${encodeURIComponent(city)}?format=j1`;
    const res  = await fetch(url);
    if (!res.ok) throw new Error('Not found');
    const data = await res.json();
    if (!data.current_condition || !data.current_condition.length) throw new Error('No data');

    rawData = data;
    addRecent(city);
    renderWeather(data);
  } catch(err) {
    showError('City not found or network error. Try another city.');
  } finally {
    setLoading(false);
  }
}

/* ─── Render weather ─── */
function renderWeather(data) {
  const cur   = data.current_condition[0];
  const area  = data.nearest_area[0];
  const fcst  = data.weather; // 3 days

  // ─ Location
  const cityName    = area.areaName[0].value;
  const countryName = area.country[0].value;
  const region      = area.region[0].value;

  // ─ Current
  const tempC      = Number(cur.temp_C);
  const feelsC     = Number(cur.FeelsLikeC);
  const humidity   = cur.humidity;
  const windKmph   = cur.windspeedKmph;
  const windDir    = cur.winddir16Point;
  const uvIndex    = cur.uvIndex;
  const visibility = cur.visibility;
  const pressure   = cur.pressure;
  const wCode      = cur.weatherCode;
  const wDesc      = cur.weatherDesc[0].value;
  const cloudCover = cur.cloudcover;

  // ─ Determine day/night (simple: local hour)
  const localHour = new Date().getHours();
  const isDay = localHour >= 6 && localHour < 20;

  // ─ Theme
  const theme = getTheme(wCode, isDay);
  document.body.className = `theme-${theme}`;

  // ─ Sunrise/sunset from forecast day 0
  const sunrise = fcst[0].astronomy[0].sunrise;
  const sunset  = fcst[0].astronomy[0].sunset;

  // ─ Hourly (today's hourly)
  const hourly  = fcst[0].hourly;

  // ─ Date string
  const now = new Date();
  const dateStr = now.toLocaleDateString('en-US', { weekday:'long', month:'long', day:'numeric' });

  // ─ UV bar position (0–11+ mapped to 0–100%)
  const uvPct = Math.min(Math.round((Number(uvIndex)/11)*100), 100);

  const html = `
    <!-- Current weather card -->
    <div class="glass-card current-weather fade-in">
      <div>
        <div class="location-name">📍 ${cityName}${region !== cityName ? ', ' + region : ''}, ${countryName}</div>
        <div class="location-date">${dateStr}</div>
        <div class="temp-display">
          <span class="temp-value" id="main-temp">${toDisplayTemp(tempC)}</span>
          <span class="temp-unit-display">°${currentUnit}</span>
        </div>
        <div class="weather-desc">${wDesc}</div>
        <div class="feels-like">Feels like ${toDisplayTemp(feelsC)}°${currentUnit}</div>

        <!-- UV bar -->
        <div class="uv-bar-wrap">
          <div class="uv-bar-label">
            <span>UV Index: <strong style="color:var(--text-primary)">${uvIndex} — ${uvLabel(uvIndex)}</strong></span>
            <span style="color:var(--text-muted)">0 &nbsp;━━━━━━&nbsp; 11+</span>
          </div>
          <div class="uv-bar">
            <div class="uv-indicator" style="left:${uvPct}%"></div>
          </div>
        </div>

        <!-- Stats -->
        <div class="stats-row">
          <div class="stat-item">
            <span class="stat-icon">💧</span>
            <span class="stat-label">Humidity</span>
            <span class="stat-value">${humidity}%</span>
          </div>
          <div class="stat-item">
            <span class="stat-icon">💨</span>
            <span class="stat-label">Wind</span>
            <span class="stat-value">${windKmph} km/h ${windDir}</span>
          </div>
          <div class="stat-item">
            <span class="stat-icon">👁️</span>
            <span class="stat-label">Visibility</span>
            <span class="stat-value">${visibility} km</span>
          </div>
          <div class="stat-item">
            <span class="stat-icon">🧭</span>
            <span class="stat-label">Pressure</span>
            <span class="stat-value">${pressure} mb</span>
          </div>
        </div>
      </div>
      <div>
        <div class="weather-icon-big">${getWeatherEmoji(wCode, isDay)}</div>
        <div style="text-align:center;margin-top:1rem;font-size:0.78rem;color:var(--text-muted);">
          ☁️ ${cloudCover}% cloud cover
        </div>
      </div>
    </div>

    <!-- Sunrise / Sunset -->
    <div class="glass-card section-card fade-in">
      <div class="forecast-header">🌅 Sun Cycle</div>
      <div class="sun-row">
        <div class="sun-item">
          <span class="sun-item-icon">🌅</span>
          <div>
            <div class="sun-item-label">Sunrise</div>
            <div class="sun-item-time">${sunrise}</div>
          </div>
        </div>
        <div class="sun-item">
          <span class="sun-item-icon">🌇</span>
          <div>
            <div class="sun-item-label">Sunset</div>
            <div class="sun-item-time">${sunset}</div>
          </div>
        </div>
      </div>
    </div>

    <!-- Hourly forecast -->
    <div class="glass-card section-card fade-in">
      <div class="forecast-header">🕐 Today — Hourly</div>
      <div class="hourly-scroll">
        ${hourly.map(h => {
          const hr   = parseInt(h.time) / 100;
          const hStr = hr === 0 ? '12 AM' : hr < 12 ? `${hr} AM` : hr === 12 ? '12 PM' : `${hr-12} PM`;
          const hC   = Number(h.tempC);
          return `
            <div class="hourly-item">
              <span class="hourly-time">${hStr}</span>
              <span class="hourly-icon">${getWeatherEmoji(h.weatherCode, hr>=6 && hr<20)}</span>
              <span class="hourly-temp">${toDisplayTemp(hC)}°</span>
            </div>
          `;
        }).join('')}
      </div>
    </div>

    <!-- 3-Day forecast -->
    <div class="glass-card section-card fade-in">
      <div class="forecast-header">📅 3-Day Forecast</div>
      <div class="forecast-grid">
        ${fcst.map((day, i) => {
          const hiC = Number(day.maxtempC);
          const loC = Number(day.mintempC);
          const avgCode = day.hourly[4]?.weatherCode || day.hourly[0].weatherCode;
          const desc = day.hourly[4]?.weatherDesc[0].value || '';
          return `
            <div class="glass-card forecast-card">
              <div class="forecast-day">${i === 0 ? 'Today' : i === 1 ? 'Tomorrow' : dayName(day.date)}</div>
              <div class="forecast-icon">${getWeatherEmoji(avgCode, true)}</div>
              <div class="forecast-temps">
                <span class="forecast-high">${toDisplayTemp(hiC)}°</span>
                <span class="forecast-low">${toDisplayTemp(loC)}°</span>
              </div>
              <div class="forecast-desc">${desc}</div>
            </div>
          `;
        }).join('')}
      </div>
    </div>

    <!-- Footer note -->
    <p style="text-align:center;font-size:0.75rem;color:var(--text-muted);margin-top:0.5rem;">
      Data via wttr.in · Last updated ${now.toLocaleTimeString('en-US', {hour:'2-digit',minute:'2-digit'})}
    </p>
  `;

  document.getElementById('weather-content').innerHTML = html;
}

/* ─── Allow Enter key on load ─── */
document.getElementById('search-input').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') doSearch();
});

/* ─── Auto-load a default city on first visit ─── */
if (recentCities.length > 0) {
  fetchWeather(recentCities[0]);
}
</script>
</body>
</html>
